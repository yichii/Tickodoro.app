<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tickodoro — Pomodoro Timer with a Hypnotic Ticking Clock</title>
<meta name="description" content="Tickodoro is a free Pomodoro timer with a hypnotic, analog ticking-clock sound, task tracking, and switchable theme packs. No sign-up — runs right in your browser.">
<meta name="keywords" content="pomodoro timer, focus timer, study timer, productivity app, ticking clock timer, task tracker, deep work, time management">
<meta name="author" content="Tickodoro">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://tickodoro.app/">

<!-- Favicons -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#E76F51">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://tickodoro.app/">
<meta property="og:title" content="Tickodoro — Pomodoro Timer with a Hypnotic Ticking Clock">
<meta property="og:description" content="A free Pomodoro timer with a hypnotic, analog ticking-clock sound, task tracking, and switchable theme packs. No sign-up required.">
<meta property="og:image" content="https://tickodoro.app/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:site_name" content="Tickodoro">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="https://tickodoro.app/">
<meta name="twitter:title" content="Tickodoro — Pomodoro Timer with a Hypnotic Ticking Clock">
<meta name="twitter:description" content="A free Pomodoro timer with a hypnotic, analog ticking-clock sound, task tracking, and switchable theme packs. No sign-up required.">
<meta name="twitter:image" content="https://tickodoro.app/assets/og-image.png">

<link rel="stylesheet" href="style.css">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Tickodoro",
  "url": "https://tickodoro.app/",
  "description": "A free Pomodoro timer with a hypnotic, analog ticking-clock sound, task tracking, and switchable theme packs.",
  "applicationCategory": "Productivity",
  "operatingSystem": "Any (runs in browser)",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  }
}
</script>
</head>
<body data-mode="focus">

  <div class="page">
    <header class="app-header">
      <div class="pack-picker">
        <span class="pack-picker-label" id="pack-picker-label">Pack</span>
        <button type="button"
                id="pack-picker-btn"
                class="pack-picker-btn"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-labelledby="pack-picker-label pack-picker-value">
          <span id="pack-picker-value" class="pack-picker-value">Study Hall</span>
          <svg class="pack-picker-chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
        <ul id="pack-picker-list" class="pack-picker-list" role="listbox" aria-labelledby="pack-picker-label" hidden>
          <li role="option" class="pack-picker-option" data-pack="studyHall" tabindex="-1" aria-selected="true">Study Hall</li>
          <li role="option" class="pack-picker-option" data-pack="midnightFocus" tabindex="-1" aria-selected="false">Midnight Focus</li>
          <li role="option" class="pack-picker-option" data-pack="watchmaker" tabindex="-1" aria-selected="false">Watchmaker</li>
          <li role="option" class="pack-picker-option" data-pack="forestRetreat" tabindex="-1" aria-selected="false">Forest Retreat</li>
          <li role="option" class="pack-picker-option" data-pack="neonArcade" tabindex="-1" aria-selected="false">Neon Arcade</li>
          <li role="option" class="pack-picker-option" data-pack="catCafe" tabindex="-1" aria-selected="false">Cat Café</li>
        </ul>
      </div>

      <div class="header-icons">
        <button id="settings-btn" class="settings-toggle" aria-label="Settings">⚙</button>
        <div class="volume-control">
          <button id="mute-toggle" class="mute-toggle" aria-pressed="false" aria-label="Mute ticking sound">
            <svg class="icon-unmuted" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M3 9v6h4l5 5V4L7 9H3z"/>
              <path d="M16.5 12c0-1.77-.77-3.29-2-4.24v8.48c1.23-.95 2-2.47 2-4.24z"/>
              <path d="M14.5 3.23v2.06c2.89 1.03 5 3.78 5 7.06s-2.11 6.02-5 7.06v2.06c4.01-1.09 7-4.76 7-9.12s-2.99-8.03-7-9.12z"/>
            </svg>
            <svg class="icon-muted" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M3 9v6h4l5 5V4L7 9H3z"/>
              <path d="M19 12l3-3-1.4-1.4-3 3-3-3L13.2 9l3 3-3 3 1.4 1.4 3-3 3 3L21 15l-3-3z"/>
            </svg>
          </button>
          <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="100" step="1" aria-label="Ticking sound volume">
        </div>
      </div>
    </header>

    <main class="app">
      <div class="mode-tabs" role="tablist" aria-label="Timer mode">
        <button class="mode-tab" data-mode="focus" role="tab" aria-selected="true">Pomodoro</button>
        <button class="mode-tab" data-mode="short" role="tab" aria-selected="false">Short Break</button>
        <button class="mode-tab" data-mode="long" role="tab" aria-selected="false">Long Break</button>
      </div>

      <div class="timer-card">
        <div class="countdown" id="countdown">25:00</div>
        <div class="controls">
          <button id="start-pause-btn" class="btn-primary">Start</button>
          <button id="reset-btn" class="btn-secondary">Reset</button>
        </div>
        <div class="cat-mascot" id="cat-mascot" aria-hidden="true">
          <svg viewBox="0 0 120 100" width="80" height="68" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 38 L32 6 L46 34 Z" fill="var(--accent)"/>
            <path d="M100 38 L88 6 L74 34 Z" fill="var(--accent)"/>
            <path d="M25 36 L33 16 L42 33 Z" fill="var(--bg)"/>
            <path d="M95 36 L87 16 L78 33 Z" fill="var(--bg)"/>
            <ellipse cx="60" cy="58" rx="42" ry="36" fill="var(--card-bg)" stroke="var(--text)" stroke-width="2.5"/>
            <path d="M40 55 Q47 50 54 55" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M66 55 Q73 50 80 55" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M56 66 L64 66 L60 71 Z" fill="var(--accent)"/>
            <path d="M60 71 Q60 76 54 76" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/>
            <path d="M60 71 Q60 76 66 76" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/>
            <path d="M18 62 L38 60" stroke="var(--text-muted)" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M18 70 L38 68" stroke="var(--text-muted)" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M102 62 L82 60" stroke="var(--text-muted)" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M102 70 L82 68" stroke="var(--text-muted)" stroke-width="1.5" stroke-linecap="round"/>
            <ellipse cx="42" cy="94" rx="12" ry="10" fill="var(--card-bg)" stroke="var(--text)" stroke-width="2"/>
            <ellipse cx="78" cy="94" rx="12" ry="10" fill="var(--card-bg)" stroke="var(--text)" stroke-width="2"/>
          </svg>
        </div>
      </div>

      <div class="session-stats">
        <span id="daily-count">0</span> pomodoros completed today
      </div>

      <section class="tasks">
        <h2>Tasks</h2>
        <form id="task-form" class="task-form">
          <input id="task-input" type="text" placeholder="What are you working on?" autocomplete="off" maxlength="200">
          <input id="task-est" type="number" min="1" max="99" value="1" title="Estimated pomodoros">
          <button type="submit" class="btn-add">Add</button>
        </form>
        <ul id="task-list" class="task-list"></ul>
      </section>
    </main>
  </div>

  <dialog id="settings-dialog" class="settings-dialog">
    <form method="dialog" class="settings-form">
      <h2>Settings</h2>
      <label>Focus (min) <input id="setting-focus" type="number" min="1" max="180"></label>
      <label>Short Break (min) <input id="setting-short" type="number" min="1" max="60"></label>
      <label>Long Break (min) <input id="setting-long" type="number" min="1" max="120"></label>
      <div class="settings-actions">
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
